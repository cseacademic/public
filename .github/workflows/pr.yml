name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Guest PRs may only touch their own posts/media/profile, with safe Markdown.
  # The checker runs from the BASE branch so a PR can't edit its own gate; the PR
  # head is only inspected as data (git diff / git show).
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ../base/scripts/ci/check-ownership.mjs
        working-directory: pr
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
