name: Publish to cse.ac

# A merged guest post goes live by rebuilding the site: this pokes the cse.ac
# Worker's Cloudflare Workers Builds deploy hook, and the site build pulls this
# repo's main branch. Runs only on pushes to main (merges), never on fork PRs,
# so the hook URL secret isn't exposed to them.
on:
  push:
    branches: [main]
    paths:
      - "src/content/**"
      - "public/media/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the cse.ac build
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::The CF_DEPLOY_HOOK secret is not set (Cloudflare → Workers → landing → Settings → Builds → Deploy Hooks)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "cse.ac build triggered."
